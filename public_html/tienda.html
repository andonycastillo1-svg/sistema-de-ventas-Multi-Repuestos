<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Catálogo de repuestos automotrices — Multi Repuestos S&A">
  <title>Multi Repuestos S&A — Catálogo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --brand:      #e85d04;
      --brand-dark: #c44b00;
      --dark-hdr:   #0f172a;
    }
    body { background: #f1f5f9; }

    /* Header */
    .tienda-header { background: var(--dark-hdr); position: sticky; top: 0; z-index: 100; }
    .brand-badge   { background: var(--brand); color: #fff; font-size: .7rem; padding: 2px 7px; border-radius: 4px; vertical-align: middle; }
    .search-input  { border: none; background: rgba(255,255,255,.12); color: #fff; border-radius: .5rem; }
    .search-input::placeholder      { color: rgba(255,255,255,.5); }
    .search-input:focus             { background: rgba(255,255,255,.2); box-shadow: none; color: #fff; }

    /* Category pills */
    .cat-pill         { cursor: pointer; border-radius: 2rem; font-size: .82rem; border: 1.5px solid #cbd5e1; background: #fff; color: #475569; transition: all .15s; }
    .cat-pill:hover   { border-color: var(--brand); color: var(--brand); }
    .cat-pill.active  { background: var(--brand); border-color: var(--brand); color: #fff; }

    /* Product card */
    .product-card          { border: none; border-radius: .75rem; transition: transform .15s, box-shadow .15s; }
    .product-card:hover    { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,.12); }
    .product-icon          { width: 100%; height: 110px; background: #e2e8f0; border-radius: .5rem .5rem 0 0; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; }
    .price-tag             { font-size: 1.3rem; font-weight: 700; color: var(--brand); }

    /* Badges */
    .badge-ok   { background: #16a34a; color: #fff; }
    .badge-low  { background: #d97706; color: #fff; }
    .badge-out  { background: #dc2626; color: #fff; }

    /* Footer */
    footer { background: var(--dark-hdr); }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="tienda-header py-3 shadow-sm">
    <div class="container">
      <div class="d-flex flex-column flex-md-row align-items-md-center gap-3">
        <div class="me-md-4 text-white d-flex align-items-center gap-2 text-nowrap">
          <span style="font-size:1.6rem">⚙️</span>
          <div>
            <div class="fw-bold" style="font-size:1.05rem">Multi Repuestos S&amp;A</div>
            <div class="text-white-50" style="font-size:.72rem">Repuestos automotrices</div>
          </div>
        </div>
        <div class="flex-grow-1">
          <input id="searchInput" type="search" class="form-control search-input"
                 placeholder="🔍  Busca por nombre, SKU, vehículo..." autocomplete="off">
        </div>
      </div>
    </div>
  </header>

  <main class="container py-4">

    <!-- Category filter -->
    <div id="catFilter" class="d-flex flex-wrap gap-2 mb-4"></div>

    <!-- Stats bar -->
    <p id="statsBar" class="text-muted small mb-3"></p>

    <!-- Loading -->
    <div id="loadingState" class="text-center py-5">
      <div class="spinner-border text-warning" style="width:2.5rem;height:2.5rem"></div>
      <p class="mt-3 text-muted">Cargando catálogo…</p>
    </div>

    <!-- Error -->
    <div id="errorState" class="alert alert-danger d-none" role="alert"></div>

    <!-- Product grid -->
    <div id="productGrid" class="row g-3"></div>

    <!-- Empty -->
    <div id="emptyState" class="text-center py-5 d-none">
      <p class="text-muted fs-5">🔎 No se encontraron productos con ese criterio.</p>
    </div>

  </main>

  <!-- FOOTER -->
  <footer class="py-4 mt-4">
    <div class="container text-center text-white-50 small">
      <p class="mb-1">© 2024 Multi Repuestos S&amp;A — Todos los derechos reservados</p>
      <p class="mb-0">Catálogo en línea — precios y disponibilidad sujetos a cambio sin previo aviso</p>
    </div>
  </footer>

  <script>
  (function () {
    var allProducts  = [];
    var activeCategory = 'all';

    function esc(str) {
      return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function stockBadge(stock, min) {
      stock = Number(stock || 0);
      min   = Number(min   || 3);
      if (stock <= 0)   return '<span class="badge badge-out">Agotado</span>';
      if (stock <= min) return '<span class="badge badge-low">Últimas unidades</span>';
      return '<span class="badge badge-ok">Disponible</span>';
    }

    function categoryIcon(cat) {
      var icons = {
        'Motor':      '🔧', 'Frenos':    '🔴', 'Suspensión': '🔩',
        'Eléctrico':  '⚡', 'Filtros':   '🌀', 'Carrocería': '🚗',
        'Transmisión':'⚙️', 'Enfriamiento':'🌡️', 'Lubricantes':'🛢️'
      };
      for (var k in icons) {
        if ((cat || '').indexOf(k) !== -1) return icons[k];
      }
      return '🔩';
    }

    function renderGrid(products) {
      var grid  = document.getElementById('productGrid');
      var empty = document.getElementById('emptyState');
      var stats = document.getElementById('statsBar');

      if (!products.length) {
        grid.innerHTML = '';
        empty.classList.remove('d-none');
        stats.textContent = '';
        return;
      }
      empty.classList.add('d-none');
      var n = products.length;
      stats.textContent = n + ' producto' + (n !== 1 ? 's' : '') + ' encontrado' + (n !== 1 ? 's' : '');

      grid.innerHTML = products.map(function (p) {
        var price = parseFloat(p.precio_venta || 0).toLocaleString('es-GT', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        var desc  = p.descripcion ? '<p class="card-text small text-muted mb-0 mt-1" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">' + esc(p.descripcion) + '</p>' : '';
        var anios = p.anio_inicio ? (p.anio_inicio + (p.anio_fin && p.anio_fin !== p.anio_inicio ? '–' + p.anio_fin : '')) : '';
        var veh   = [p.marca_vehiculo, p.modelo_vehiculo, anios].filter(Boolean).join(' ');
        veh = veh ? '<p class="mb-1 fw-semibold" style="font-size:.75rem;color:#0f172a">🚗 ' + esc(veh) + '</p>' : '';
        var cat   = veh + (p.categoria ? '<span class="badge bg-secondary bg-opacity-25 text-secondary me-1 mb-1" style="font-size:.72rem">' + esc(p.categoria) + '</span>' : '');
        return '<div class="col-6 col-sm-4 col-lg-3">' +
          '<div class="card product-card shadow-sm h-100">' +
            '<div class="product-icon">' + categoryIcon(p.categoria) + '</div>' +
            '<div class="card-body d-flex flex-column pt-2 pb-3">' +
              '<div class="mb-1">' + stockBadge(p.stock_actual, p.stock_minimo) + '</div>' +
              '<h6 class="card-title fw-semibold mb-0 lh-sm" style="font-size:.88rem">' + esc(p.nombre) + '</h6>' +
              '<p class="text-muted mb-1" style="font-size:.75rem">SKU: ' + esc(p.sku) + '</p>' +
              cat + desc +
              '<div class="mt-auto pt-2 border-top">' +
                '<span class="price-tag">Q&nbsp;' + price + '</span>' +
              '</div>' +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    function filter() {
      var q = document.getElementById('searchInput').value.toLowerCase().trim();
      var filtered = allProducts.filter(function (p) {
        if (activeCategory !== 'all' && p.categoria !== activeCategory) { return false; }
        if (!q) { return true; }
        return [p.nombre, p.sku, p.descripcion, p.marca_vehiculo, p.modelo_vehiculo, p.anio_inicio, p.anio_fin]
          .join(' ').toLowerCase().indexOf(q) !== -1;
      });
      renderGrid(filtered);
    }

    function buildCatFilter(categorias) {
      var container = document.getElementById('catFilter');
      var pills = [{ label: 'Todos', value: 'all' }].concat(
        categorias.map(function (c) { return { label: c, value: c }; })
      );
      container.innerHTML = pills.map(function (p) {
        var active = p.value === 'all' ? ' active' : '';
        return '<button class="btn cat-pill' + active + '" data-cat="' + esc(p.value) + '">' + esc(p.label) + '</button>';
      }).join('');
      container.addEventListener('click', function (e) {
        var btn = e.target.closest('[data-cat]');
        if (!btn) { return; }
        activeCategory = btn.dataset.cat;
        container.querySelectorAll('.cat-pill').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        filter();
      });
    }

    // Load
    fetch('api/tienda.php')
      .then(function (r) { if (!r.ok) { throw new Error('HTTP ' + r.status); } return r.json(); })
      .then(function (data) {
        document.getElementById('loadingState').classList.add('d-none');
        allProducts = data.productos || [];
        buildCatFilter(data.categorias || []);
        renderGrid(allProducts);
        document.getElementById('searchInput').addEventListener('input', filter);
      })
      .catch(function () {
        document.getElementById('loadingState').classList.add('d-none');
        var err = document.getElementById('errorState');
        err.textContent = 'No se pudo cargar el catálogo. Intenta más tarde.';
        err.classList.remove('d-none');
      });
  })();
  </script>
</body>
</html>
