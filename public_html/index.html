<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Multi Repuestos - Punto de Venta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container-fluid">
      <span class="navbar-brand">Multi Repuestos</span>
      <button id="logoutBtn" class="btn btn-outline-light btn-sm d-none" type="button">Salir</button>
    </div>
  </nav>

  <main class="container py-4">
    <section id="loginCard" class="row justify-content-center">
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card shadow-sm">
          <div class="card-body">
            <h1 class="h4 mb-3">Iniciar sesión</h1>
            <form id="loginForm">
              <div class="mb-3">
                <label class="form-label" for="loginUsuario">Usuario o correo</label>
                <input id="loginUsuario" class="form-control" name="usuario" autocomplete="username" required>
              </div>
              <div class="mb-3">
                <label class="form-label" for="loginPassword">Contraseña</label>
                <input id="loginPassword" class="form-control" type="password" name="password" autocomplete="current-password" required>
              </div>
              <button id="loginSubmitBtn" class="btn btn-primary w-100" type="submit">Entrar</button>
              <button id="healthCheckBtn" class="btn btn-outline-secondary w-100 mt-2" type="button">Probar conexión</button>
            </form>
          </div>
        </div>
      </div>
    </section>

    <section id="posCard" class="d-none">
      <div class="row g-3">
        <div class="col-12 col-lg-5">
          <div class="card shadow-sm">
            <div class="card-body">
              <h2 class="h5">Venta rápida</h2>
              <form id="addItemForm" class="row g-2">
                <div class="col-12">
                  <label class="form-label" for="productoId">ID Producto</label>
                  <input id="productoId" class="form-control" type="number" min="1" required>
                </div>
                <div class="col-12">
                  <label class="form-label" for="cantidad">Cantidad</label>
                  <input id="cantidad" class="form-control" type="number" min="0.001" step="0.001" value="1" required>
                </div>
                <div class="col-12">
                  <button class="btn btn-success w-100" type="submit">Agregar al carrito</button>
                </div>
              </form>
            </div>
          </div>
        </div>

        <div class="col-12 col-lg-7">
          <div class="card shadow-sm">
            <div class="card-body">
              <h2 class="h5">Carrito</h2>
              <div class="table-responsive">
                <table class="table table-sm align-middle">
                  <thead>
                    <tr>
                      <th>Producto ID</th>
                      <th class="text-end">Cantidad</th>
                      <th></th>
                    </tr>
                  </thead>
                  <tbody id="cartBody"></tbody>
                </table>
              </div>
              <div class="d-flex gap-2 justify-content-end">
                <button id="clearCartBtn" class="btn btn-outline-secondary" type="button">Limpiar</button>
                <button id="emitSaleBtn" class="btn btn-primary" type="button">Emitir venta</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <div id="message" class="alert mt-3 d-none" role="alert"></div>
  </main>

  <noscript><div class="container"><div class="alert alert-danger">Tu navegador tiene JavaScript desactivado. Actívalo para usar la app.</div></div></noscript>
  <script src="assets/app.js?v=2"></script>
</body>
</html>
