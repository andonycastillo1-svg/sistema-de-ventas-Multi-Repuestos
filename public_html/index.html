<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Multi Repuestos - Punto de Venta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container-fluid">
      <span class="navbar-brand">Multi Repuestos</span>
      <button id="logoutBtn" class="btn btn-outline-light btn-sm d-none" type="button">Salir</button>
    </div>
  </nav>

  <main class="container py-4">
    <section id="loginCard" class="row justify-content-center">
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card shadow-sm">
          <div class="card-body">
            <h1 class="h4 mb-3">Iniciar sesión</h1>
            <form id="loginForm">
              <div class="mb-3">
                <label class="form-label" for="loginUsuario">Usuario o correo</label>
                <input id="loginUsuario" class="form-control" name="usuario" autocomplete="username" required>
              </div>
              <div class="mb-3">
                <label class="form-label" for="loginPassword">Contraseña</label>
                <input id="loginPassword" class="form-control" type="password" name="password" autocomplete="current-password" required>
              </div>
              <button id="loginSubmitBtn" class="btn btn-primary w-100" type="submit">Entrar</button>
              <button id="healthCheckBtn" class="btn btn-outline-secondary w-100 mt-2" type="button">Probar conexión</button>
            </form>
          </div>
        </div>
      </div>
    </section>

    <section id="posCard" class="d-none">
      <div class="row g-3">
        <div class="col-12 col-lg-5">
          <div class="card shadow-sm">
            <div class="card-body">
              <h2 class="h5">Venta rápida</h2>
              <form id="addItemForm" class="row g-2">
                <div class="col-12">
                  <label class="form-label" for="productoId">ID Producto</label>
                  <input id="productoId" class="form-control" type="number" min="1" required>
                </div>
                <div class="col-12">
                  <label class="form-label" for="cantidad">Cantidad</label>
                  <input id="cantidad" class="form-control" type="number" min="0.001" step="0.001" value="1" required>
                </div>
                <div class="col-12">
                  <button class="btn btn-success w-100" type="submit">Agregar al carrito</button>
                </div>
              </form>
            </div>
          </div>
        </div>

        <div class="col-12 col-lg-7">
          <div class="card shadow-sm">
            <div class="card-body">
              <h2 class="h5">Carrito</h2>
              <div class="table-responsive">
                <table class="table table-sm align-middle">
                  <thead>
                    <tr>
                      <th>Producto ID</th>
                      <th class="text-end">Cantidad</th>
                      <th></th>
                    </tr>
                  </thead>
                  <tbody id="cartBody"></tbody>
                </table>
              </div>
              <div class="mb-3">
                <label class="form-label" for="ventaDescuento">Descuento de venta</label>
                <input id="ventaDescuento" class="form-control" type="number" min="0" step="0.01" value="0">
              </div>
              <div class="d-flex gap-2 justify-content-end">
                <button id="clearCartBtn" class="btn btn-outline-secondary" type="button">Limpiar</button>
                <button id="emitSaleBtn" class="btn btn-primary" type="button">Emitir venta</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="row g-3 mt-1">
        <div class="col-12 col-xl-6">
          <div class="card shadow-sm">
            <div class="card-body">
              <h2 class="h5">Crear producto</h2>
              <form id="productForm" class="row g-2">
                <div class="col-6"><input class="form-control" name="sku" placeholder="SKU" required></div>
                <div class="col-6"><input class="form-control" name="nombre" placeholder="Nombre" required></div>
                <div class="col-6"><input class="form-control" name="categoria" placeholder="Categoría" value="General"></div>
                <div class="col-6"><input class="form-control" name="unidad" placeholder="Unidad" value="PZA"></div>
                <div class="col-4"><input class="form-control" name="costoCompra" type="number" step="0.01" placeholder="Costo"></div>
                <div class="col-4"><input class="form-control" name="precioVenta" type="number" step="0.01" placeholder="Precio"></div>
                <div class="col-4"><input class="form-control" name="ivaPorcentaje" type="number" step="0.01" placeholder="IVA %" value="0"></div>
                <div class="col-4"><input class="form-control" name="stockActual" type="number" step="0.001" placeholder="Stock" value="0"></div>
                <div class="col-4"><input class="form-control" name="stockMinimo" type="number" step="0.001" placeholder="Stock mín." value="0"></div>
                <div class="col-4"><input class="form-control" name="stockMaximo" type="number" step="0.001" placeholder="Stock máx." value="0"></div>
                <div class="col-12"><button class="btn btn-primary w-100" type="submit">Guardar producto</button></div>
              </form>
              <div id="productsList" class="small mt-3"></div>
            </div>
          </div>
        </div>

        <div class="col-12 col-xl-6">
          <div class="card shadow-sm">
            <div class="card-body">
              <h2 class="h5">Ingresar compra / entrada de producto</h2>
              <form id="purchaseForm" class="row g-2">
                <div class="col-6"><input class="form-control" name="proveedorNit" placeholder="NIT proveedor" value="CF"></div>
                <div class="col-6"><input class="form-control" name="proveedorNombre" placeholder="Proveedor" value="Proveedor General"></div>
                <div class="col-4"><input class="form-control" name="productoId" type="number" placeholder="ID producto" required></div>
                <div class="col-4"><input class="form-control" name="cantidad" type="number" step="0.001" placeholder="Cantidad" required></div>
                <div class="col-4"><input class="form-control" name="costoUnitario" type="number" step="0.01" placeholder="Costo unitario" required></div>
                <div class="col-12"><button class="btn btn-primary w-100" type="submit">Registrar compra recibida</button></div>
              </form>
              <div id="purchasesList" class="small mt-3"></div>
            </div>
          </div>
        </div>

        <div class="col-12 col-xl-4">
          <div class="card shadow-sm">
            <div class="card-body">
              <h2 class="h5">Crear usuario</h2>
              <form id="userForm" class="row g-2">
                <div class="col-12"><input class="form-control" name="usuario" placeholder="Usuario" required></div>
                <div class="col-12"><input class="form-control" name="email" type="email" placeholder="Correo" required></div>
                <div class="col-12"><input class="form-control" name="nombre" placeholder="Nombre" required></div>
                <div class="col-12"><input class="form-control" name="password" type="password" minlength="8" placeholder="Contraseña" required></div>
                <div class="col-12"><input class="form-control" name="rol" placeholder="Rol" value="VENDEDOR"></div>
                <div class="col-12"><button class="btn btn-primary w-100" type="submit">Guardar usuario</button></div>
              </form>
            </div>
          </div>
        </div>

        <div class="col-12 col-xl-4">
          <div class="card shadow-sm">
            <div class="card-body">
              <h2 class="h5">Bancos y pagos</h2>
              <form id="bankForm" class="row g-2 mb-3">
                <div class="col-7"><input class="form-control" name="nombre" placeholder="Banco" required></div>
                <div class="col-5"><input class="form-control" name="numeroCuenta" placeholder="Cuenta"></div>
                <div class="col-12"><button class="btn btn-outline-primary w-100" type="submit">Crear banco</button></div>
              </form>
              <form id="bankPaymentForm" class="row g-2">
                <div class="col-6"><input class="form-control" name="bancoId" type="number" placeholder="ID banco" required></div>
                <div class="col-6"><input class="form-control" name="monto" type="number" step="0.01" placeholder="Monto" required></div>
                <div class="col-12"><input class="form-control" name="referencia" placeholder="Referencia"></div>
                <div class="col-12"><button class="btn btn-primary w-100" type="submit">Registrar pago a banco</button></div>
              </form>
              <div id="banksList" class="small mt-3"></div>
            </div>
          </div>
        </div>

        <div class="col-12 col-xl-4">
          <div class="card shadow-sm">
            <div class="card-body">
              <h2 class="h5">Total vendido</h2>
              <form id="reportForm" class="row g-2">
                <div class="col-6"><input class="form-control" name="desde" type="date"></div>
                <div class="col-6"><input class="form-control" name="hasta" type="date"></div>
                <div class="col-12"><button class="btn btn-primary w-100" type="submit">Ver reporte</button></div>
              </form>
              <div id="salesReport" class="mt-3 fw-bold"></div>
            </div>
          </div>
        </div>
      </div>

    </section>

    <div id="message" class="alert mt-3 d-none" role="alert"></div>
  </main>

  <noscript><div class="container"><div class="alert alert-danger">Tu navegador tiene JavaScript desactivado. Actívalo para usar la app.</div></div></noscript>
  <script src="assets/app.js?v=3"></script>
</body>
</html>
